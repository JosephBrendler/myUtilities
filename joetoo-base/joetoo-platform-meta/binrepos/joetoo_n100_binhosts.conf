### NO -- gmkg5 (g5nuc01) n95 cpu flags differ from g2 and g3 n100

#[gmki91] #[gmki92]
# NOTE: aldernake-N models (n97/n100/n150) are EFFICIENCY machines with "e-cores"
# whearas core i5/i7/i9 like gmki91-12900HK are PERFORMANCE machines with p-cores as well as e-cores
# considered to be alderlake-hybrid, so they have different instruction sets pertaining to p-cores
# relatie to aldernake-N models, although all are "alderlake" cpus
# gmki91 and gmki92 binhost for each other via /etc/portage/binrepos.conf/joetoo_gmki9_alderlake_binhosts.conf and
# its entries for x86_64-pc-linux-gnu-alderlake-packages
#
# Above standardizes N100 cpu flags as common denominator among aldelake-N machines.
# N97 and n150 also have "avx_vnni bmi1 bmi2" capability, these must be removed if they are to participate in the "n100" binhost cluster
#
# see also /etc/portage/package.use/00cpu-flags and /etc/portage/make.conf's COMMON_FLAGS="..."
